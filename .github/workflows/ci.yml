name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # envtest needs a real kube-apiserver + etcd on disk. Cache the download
      # so only the first run on a given Makefile revision pays for it.
      - name: Cache envtest binaries
        uses: actions/cache@v4
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: envtest-${{ runner.os }}-

      - name: Run unit tests
        run: make check

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint v2
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.12.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Verify codegen is up to date
        run: make verify-codegen

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Lint API types (kube-api-linter)
        run: make lint-api
